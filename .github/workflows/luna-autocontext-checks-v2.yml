name: LUNA AutoContext checks

on:
  push:
    branches: [feature/luna-autocontext-mvp]
    paths:
      - 'tools/luna-autocontext/**'
      - '.github/workflows/luna-autocontext-checks.yml'
      - '.github/workflows/luna-autocontext-checks-v2.yml'
  pull_request:
    paths:
      - 'tools/luna-autocontext/**'
      - '.github/workflows/luna-autocontext-checks-v2.yml'
  workflow_dispatch:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check tools/luna-autocontext/service-worker.js
          node --check tools/luna-autocontext/content.js
          node --check tools/luna-autocontext/popup.js
      - name: Check manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('tools/luna-autocontext/manifest.json', 'utf8'))"
