<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" role="img" aria-labelledby="title desc">
<title id="title">The Author's Crest</title>
<desc id="desc">The Author's Crest: an angular gold crown with a central vertical beam, nested energy arcs, and luminous horizon rings on an obsidian field.</desc>
<defs>
  <radialGradient id="bg" cx="50%" cy="42%" r="70%"><stop offset="0" stop-color="#0b0b0b"/><stop offset=".62" stop-color="#030303"/><stop offset="1" stop-color="#000"/></radialGradient>
