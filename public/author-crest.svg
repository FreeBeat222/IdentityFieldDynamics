  <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#8b6929" stop-opacity="0"/><stop offset=".45" stop-color="#d6b15a"/><stop offset=".5" stop-color="#fff2bd"/><stop offset=".55" stop-color="#d6b15a"/><stop offset="1" stop-color="#8b6929" stop-opacity="0"/></linearGradient>
