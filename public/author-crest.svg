  <linearGradient id="beam"><stop stop-color="transparent"/><stop offset=".42" stop-color="#d6b15a"/><stop offset=".5" stop-color="#fff7cf"/><stop offset=".58" stop-color="#d6b15a"/><stop offset="1" stop-color="transparent"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
