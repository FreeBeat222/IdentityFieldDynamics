<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">The Author's Crest</title><desc id="desc">A gold and obsidian crown suspended above a luminous horizon ring, crossed by a vertical beam and surrounded by coherent energy arcs.</desc>
<defs>
  <radialGradient id="bg"><stop offset="0" stop-color="#21190a"/><stop offset=".5" stop-color="#080808"/><stop offset="1" stop-color="#020202"/></radialGradient>
