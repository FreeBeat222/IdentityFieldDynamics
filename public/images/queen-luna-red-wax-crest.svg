<title id="title">Red Wax Crest Seal of Her Majesty Queen Luna Stone of Electric Ladyland</title>
<desc id="desc">A modest red wax signet impression bearing a crowned crescent and radiant eight-pointed star, with the inscription LUNA STONE and L'ESPRIT N'A POINT DE FRONTIÈRES.</desc>
